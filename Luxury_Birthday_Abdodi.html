<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Abdodi</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:Trebuchet MS;background:radial-gradient(circle,#301060,#090014);color:#fff}
#stars,#hearts,#balloons{position:fixed;inset:0;pointer-events:none}
.star,.heart,.balloon{position:absolute;animation:float linear infinite}
.star{width:3px;height:3px;background:#fff;box-shadow:0 0 8px #fff}
.heart{color:#ff5b93;font-size:22px}
.balloon{font-size:34px}
@keyframes float{from{transform:translateY(110vh)}to{transform:translateY(-20vh)}}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
h1{font-size:4rem;text-shadow:0 0 20px gold}
.num{font-size:6rem;animation:glow 1s infinite alternate}
@keyframes glow{to{text-shadow:0 0 30px #ffd700}}
button{padding:14px 24px;border-radius:30px;border:none;background:#ff4f88;color:#fff;font-size:18px;cursor:pointer}
#gift{font-size:80px;cursor:pointer;animation:bounce 1.2s infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
#msg{display:none;font-size:1.3rem;max-width:700px}
</style></head><body>
<div id="stars"></div><div id="hearts"></div><div id="balloons"></div>
<div class="center">
<h1>🎉 Happy Birthday Abdodi 🎉</h1>
<div class="num">🕯️25🕯️</div>
<div id="gift" onclick="openGift()">🎁</div>
<div id="msg">
<p>Happy 25th Birthday! 💖<br>
May this year bring you endless happiness, success, love, laughter, and unforgettable memories. Wishing you a life full of dreams coming true. ✨</p>
<button onclick="document.getElementById('music').play()">🎵 Play Music</button>
</div>
</div>
<audio id="music" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>
<script>
function add(cls,txt,n){let c=document.getElementById(cls);for(let i=0;i<n;i++){let e=document.createElement('div');e.className=cls.slice(0,-1);e.textContent=txt;let s=e.style;s.left=Math.random()*100+'vw';s.top=Math.random()*100+'vh';s.animationDuration=(5+Math.random()*8)+'s';s.animationDelay=(-Math.random()*8)+'s';if(cls=='stars'){e.textContent='';}c.appendChild(e);}}
for(let i=0;i<120;i++){let e=document.createElement('div');e.className='star';e.style.left=Math.random()*100+'vw';e.style.top=Math.random()*100+'vh';document.getElementById('stars').appendChild(e);}
add('hearts','❤',40);add('balloons','🎈',20);
function openGift(){document.getElementById('gift').textContent='🎂';document.getElementById('msg').style.display='block';confetti();}
function confetti(){for(let i=0;i<150;i++){let d=document.createElement('div');d.textContent=['✨','🎉','💖'][i%3];d.style.position='fixed';d.style.left=Math.random()*100+'vw';d.style.top='-20px';d.style.fontSize='24px';d.style.transition='transform 4s linear';document.body.appendChild(d);setTimeout(()=>{d.style.transform='translateY(110vh) rotate(720deg)';},10);setTimeout(()=>d.remove(),4500);}}
</script></body></html>
